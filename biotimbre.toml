[library]
data_dir = "data"

[ui]
language = "en"            # en | pt_BR

# Serve the search page alone, with the library opened read-only: no library
# page, no library chooser, nothing that can change what is stored. For giving
# other people a way to search this library without giving them the library.
# Needs a library to point at, since it may not open or create one.
# For one run only: biotimbre gui --search-only
search_only = false

[sources.inaturalist]
# Offer to fetch a recording from iNaturalist by observation ID, in the search
# page's query card and the library page's add form. Set false for a library
# kept offline; nothing else changes.
enabled = true

[map]
# The location map: one per page, plotting every item on the library page and
# the current results on the search page. Leaflet is served from this process,
# but the basemap tiles below are fetched from OpenStreetMap as a page is
# drawn — the only part of the interface that reaches the network on its own.
# Set false for a library kept offline; location filtering is unaffected.
# For one run only: biotimbre gui --no-map
enabled = true
# tile_url    = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
# attribution = "&copy; OpenStreetMap contributors"
# max_zoom    = 19

[ui.theme]
# Every key optional; omitted ones fall back to the built-in defaults.
primary = "#20460a"
secondary = "#fcfee5"
accent = "#e9b44c"
dark = "#20460a"
positive = "#118b50"
negative = "#c62828"
info = "#2f6f9f"
warning = "#e9b44c"
button_text = "#fcfee5"
page_bg = "#f4f6ef"
text = "#1a2712"
header_bg = "#122806"
header_text = "#fcfee5"
header_inactive_text = "rgba(255, 255, 255, 0.65)"
header_active_bg = "rgba(255, 255, 255, 0.2)"
header_status_ready = "#fcfee5"
header_status_loading = "#ffd166"
header_status_failed = "#ff8a8a"
card = "#ffffff"
link = "#118b50"
muted = "#5b6b52"
notice = "#92400e"
surface = "#eef1e6"
chip = "#dde4d1"
marker_border = "rgba(252, 254, 229, 0.8)"
marker_fill = "rgba(252, 254, 229, 0.25)"
# spectrogram_colors = ["#0c0826", "#400c60", "#941a60", "#de5234", "#fca83c", "#fff4c8"]

# The dark theme. Same keys, same meanings; omitted ones fall back to the
# built-in dark defaults, never to the light values above. Readers choose
# light, dark, or "follow my system" from the header — the choice is theirs and
# is kept per browser, so this section only says what each theme looks like.
#
# spectrogram_colors has no dark counterpart: the images are rendered and
# cached server-side, where the reader's theme is not known.
[ui.dark_theme]
# primary = "#5a9c3e"
# page_bg = "#111509"
# text = "#e7ecdc"
# header_bg = "#0d1a05"
# card = "#171d10"
# surface = "#1a2113"
# chip = "#26301c"
# link = "#8bd17a"
# muted = "#9aa88f"
# notice = "#f0b46a"