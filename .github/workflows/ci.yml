name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this first, and publishes the wheel built here.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev --extra gui
      # The models-marked tests run Perch and BirdNET. Fetching them (about
      # 70 MB from Hugging Face) as a step of its own keeps a slow download out
      # of any one test's time limit, and says plainly when the network is the
      # problem.
      - name: Fetch the models
        shell: bash
        run: uv run biotimbre --data-dir "$RUNNER_TEMP/models" init --name fetch
      - name: Test
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the version agrees everywhere
        run: |
          version=$(uv version --short)
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/biotimbre/__init__.py)
          if [ "$version" != "$code" ]; then
            echo "::error::pyproject.toml says $version, src/biotimbre/__init__.py says $code"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # What a new user does: run the installer on a machine with no Python set
  # up, then start the interface. The wheel stands in for the PyPI release.
  installer:
    name: installer / ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run install.sh
        if: runner.os != 'Windows'
        run: |
          BIOTIMBRE_PACKAGE="biotimbre[gui] @ $(ls "$PWD"/dist/*.whl)" sh scripts/install.sh
      # The command from the README, as typed, in Windows PowerShell 5.1 (the
      # one every Windows machine has). Release assets are served as
      # application/octet-stream, and 5.1's irm hands such a script to iex line
      # by line, so this script is served the same way from a local server.
      - name: Run install.ps1 with the README command
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:BIOTIMBRE_PACKAGE = "biotimbre[gui] @ $((Get-ChildItem dist\*.whl).FullName)"
          $Release = "https://github.com/biodiversica/biotimbre/releases/latest/download/install.ps1"
          $Local = "http://localhost:8766/install.ps1"

          $Server = Start-Job -ArgumentList (Resolve-Path scripts\install.ps1).Path {
              param($Path)
              $Bytes = [IO.File]::ReadAllBytes($Path)
              $Listener = New-Object System.Net.HttpListener
              $Listener.Prefixes.Add("http://localhost:8766/")
              $Listener.Start()
              while ($true) {
                  $Context = $Listener.GetContext()
                  $Context.Response.ContentType = "application/octet-stream"
                  $Context.Response.OutputStream.Write($Bytes, 0, $Bytes.Length)
                  $Context.Response.Close()
              }
          }
          try {
              $Ready = $false
              foreach ($i in 1..30) {
                  try { $null = Invoke-RestMethod $Local; $Ready = $true; break } catch { Start-Sleep 1 }
              }
              if (-not $Ready) { Receive-Job $Server; throw "the local server did not start" }

              # What irm returns, here and from the real release, for the log.
              foreach ($Url in $Local, $Release) {
                  try {
                      $Body = Invoke-RestMethod $Url
                      Write-Host ("irm {0} -> {1}, {2} item(s)" -f $Url, $Body.GetType().FullName, @($Body).Count)
                  } catch { Write-Host "irm $Url failed: $_" }
              }

              $Line = (Select-String -Path README.md -SimpleMatch "irm $Release").Line
              if (-not $Line) { throw "README.md has no install command fetching $Release" }
              $Command = $Line.Replace($Release, $Local)
              Write-Host "> $Command"
              Invoke-Expression $Command
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
              Stop-Job $Server
              Remove-Job $Server -Force
          }

      - name: The launcher is in place
        run: |
          case "$RUNNER_OS" in
            Linux)   test -f "$HOME/.local/share/applications/biotimbre.desktop" ;;
            macOS)   test -x "$HOME/Desktop/biotimbre.command" ;;
            Windows) test -f "$USERPROFILE/Desktop/biotimbre.lnk" ;;
          esac

      # Started from the work folder as the launcher starts it: no library is
      # configured there, so the page is the library chooser.
      - name: The installed command runs and serves the interface
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          biotimbre --version
          cd "$HOME/biotimbre"
          biotimbre gui --no-browser --port 8765 > gui.log 2>&1 &
          for _ in $(seq 90); do
            curl -fsS http://127.0.0.1:8765/media/status && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ | grep -q "Choose a library" || { cat gui.log; exit 1; }
