[project]
name = "biotimbre"
version = "0.1.0"
description = "Local library of animal vocalization samples with embedding-based similarity search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.12",
    # Perch v2's graph is ONNX IR version 10, which 1.17 cannot load.
    "onnxruntime>=1.18",
    "huggingface_hub>=0.20",
]

[project.urls]
Homepage = "https://github.com/biodiversica/biotimbre"
Documentation = "https://github.com/biodiversica/biotimbre#readme"
Issues = "https://github.com/biodiversica/biotimbre/issues"

[project.optional-dependencies]
# The GUI. Kept optional so a headless or CLI-only install stays lean.
#   uv tool install "biotimbre[gui]"   /   uv sync --extra gui
gui = [
    # The oldest release the page tests pass on.
    "nicegui>=3.12",
    "pillow>=10.1",  # load_default(size=...) for spectrogram labels
]

dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]

[project.scripts]
biotimbre = "biotimbre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biotimbre"]

[tool.hatch.build.targets.sdist]
# Editor and agent settings are per-checkout, not part of the source release.
exclude = [".claude", ".vscode", ".github"]

[tool.uv]
# The uv cache and this project are on different filesystems (the project lives
# on an external drive), so hardlinking is unavailable and warns on every sync.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs the ONNX model files (downloaded on first run, then cached). Skip with -m 'not models'.",
]
# NiceGUI's simulated-user fixtures are async, so async tests must run without
# each needing an explicit marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# NiceGUI's fixtures otherwise try to import a root main.py to discover pages.
# This project has no such entry point: pages come from biotimbre.ui.app, which
# tests import explicitly.
main_file = ""
