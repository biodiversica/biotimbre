[project]
name = "biotimbre-library"
version = "0.1.0"
description = "Local library of animal vocalization samples with embedding-based similarity search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "soundfile",
    "scipy",
    "onnxruntime",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
biotimbre = "biotimbre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biotimbre"]

[tool.uv]
# The uv cache and this project are on different filesystems (the project lives
# on an external drive), so hardlinking is unavailable and warns on every sync.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs the ONNX model files (downloaded on first run, then cached). Skip with -m 'not models'.",
]
